# job_profiles.yaml — job categories, classification keywords, and what to emphasise per category.
# Each scraped job is classified by counting `keywords` hits in its text.
#
# personalize.py fills in the personal parts from YOUR resume:
#   summary_focus         — fallback resume summary for this category (used when Ollama is off)
#   priority_experiences  — company names from resume_data.yaml to favour for this category
#   priority_projects     — project names from resume_data.yaml to favour for this category
# Edit `keywords` freely to add categories that fit your field.

